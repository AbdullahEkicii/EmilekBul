name: emilekbul
description: "A new Flutter project."

publish_to: 'none' 

version: 1.5.31+59

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.0.2
  google_generative_ai: ^0.4.7
  provider: ^6.0.5
  animated_text_kit: ^4.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  http: ^1.2.1
  html: ^0.15.4
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  flutter_timezone: ^5.0.0
  android_intent_plus: ^5.3.0
  device_info_plus: ^11.5.0
  permission_handler: 12.0.1
  cupertino_icons: ^1.0.8
  firebase_core_dart: ^1.0.1
  firebase_core: 4.13.0
  firebase_auth: ^6.0.0
  firebase_storage: ^13.0.0
  # 6.8.0 Android'de transaction bitince EventChannel cancel MissingPluginException (fatal crash) veriyordu.
  # 6.9.0+ firebase_core ^4.14 ister (core 4.15 Android build'i kırdığı için pin'lendi), o yüzden 6.7.1'e sabitlendi.
  cloud_firestore: 6.7.1
  firebase_analytics: ^12.0.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.3.0
  google_mobile_ads: ^6.0.0
  games_services: ^4.0.0
  font_awesome_flutter: ^10.7.0
  audioplayers: ^6.0.0

  easy_localization: ^3.0.8
  firebase_app_check: ^0.4.5+2
  in_app_review: ^2.0.9
 
  path: any
  share_plus: ^12.0.2
  visibility_detector: ^0.4.0+2
  firebase_remote_config: ^6.5.6
  firebase_crashlytics: ^5.2.7
  workmanager: ^0.9.2
  lottie: ^3.3.1
  home_widget: ^0.9.2+1
  firebase_messaging: ^16.5.0

# workmanager 0.9.x: pub en yeni platform_interface'i (0.9.4) seçince workmanager_apple 0.9.4 ile
# API uyuşmazlığı oluşup Dart derlemesi bozuluyor; birbiriyle uyumlu sürümlere sabitlendi.
dependency_overrides:
  workmanager_platform_interface: 0.9.3
  workmanager_android: 0.9.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4 
  flutter_test:
    sdk: flutter
  

  
  flutter_lints: ^6.0.0


flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/app_icon.png"
  image_path_android: "lib/assets/app_icon.png"
  adaptive_icon_foreground: "lib/assets/app_icon.png"
  adaptive_icon_background: "#0A84FF"
  image_path_ios: "lib/assets/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0A84FF"

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/sound/
    - avatars/
    - assets/translations/
    - assets/google_fonts/
    - assets/lottie/
    - .env
  shaders:
    - shaders/wheel_glow.frag

  
