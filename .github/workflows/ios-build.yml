name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.7'

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env (asset required by pubspec)
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV_CONTENT }}
        run: |
          if [ -n "$DOTENV_CONTENT" ]; then
            printf '%s\n' "$DOTENV_CONTENT" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env (asset required by pubspec)
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV_CONTENT }}
        run: |
          if [ -n "$DOTENV_CONTENT" ]; then
            printf '%s\n' "$DOTENV_CONTENT" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator (debug)
        run: flutter build ios --simulator --debug

      - name: Package Runner.app
        run: |
          cd build/ios/iphonesimulator
          zip -r --symlinks "$GITHUB_WORKSPACE/Runner-simulator.app.zip" Runner.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Runner-simulator-app
          path: Runner-simulator.app.zip
          retention-days: 7
